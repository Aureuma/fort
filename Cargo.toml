[package]
name = "fort"
version = "0.2.10"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.8"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.6.0", features = ["derive"] }
ecies = { version = "0.2.10", default-features = false, features = ["std", "pure"] }
hex = "0.4.3"
http = "1.3.1"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
libc = "0.2.183"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8.23"
url = "2.5.7"

[[bin]]
name = "fort"
path = "src/bin/fort.rs"

[[bin]]
name = "fortd"
path = "src/bin/fortd.rs"

[[bin]]
name = "fort-agent"
path = "src/bin/fort-agent.rs"

[[bin]]
name = "fort-seed"
path = "src/bin/fort-seed.rs"

[[bin]]
name = "fort-breakglass"
path = "src/bin/fort-breakglass.rs"
