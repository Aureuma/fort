name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SI repo (Fort/SI Vault integration fixture)
        uses: actions/checkout@v4
        with:
          repository: Aureuma/si
          path: si
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          go build ./cmd/fort
          go build ./cmd/fortd
      - name: Build image
        run: docker build -t fort:ci .
      - name: Integration tests
        env:
          SI_REPO: ${{ github.workspace }}/si
        run: go test -tags integration ./integration/...
