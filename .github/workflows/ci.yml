name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          go build ./cmd/fort
          go build ./cmd/fortd
      - name: Build image
        run: docker build -t fort:ci .
