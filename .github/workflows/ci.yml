name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build binaries
        run: cargo build --locked --release --bin fort --bin fortd --bin fort-agent --bin fort-seed
      - name: Build image
        run: docker build -t fort:ci .
