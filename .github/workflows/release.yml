name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v1.0.7)
        required: true
        type: string
      publish:
        description: Upload release assets and update the Homebrew tap
        required: true
        default: false
        type: boolean

concurrency:
  group: release-assets-${{ github.event.release.tag_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_BUILD_JOBS: 2

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve release inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          checkout_ref="${{ github.event.release.tag_name }}"
          publish="true"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
            checkout_ref="${GITHUB_SHA}"
            publish="${{ github.event.inputs.publish }}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "No release tag provided." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "Preparing release assets for tag ${tag} from ${checkout_ref} (publish=${publish})"

  build-release-asset:
    name: Build ${{ matrix.target }}
    needs: [resolve-tag]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: darwin-amd64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Validate release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "v${version}" != "${tag}" ]]; then
            echo "tag ${tag} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "tag ${tag} matches package version ${version}"

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="${tag#v}"
          target="${{ matrix.target }}"
          rust_target="${{ matrix.rust_target }}"
          os="${target%%-*}"
          arch="${target##*-}"
          cargo build --locked --release --jobs 2 --target "${rust_target}" \
            --bin fort --bin fortd --bin fort-agent
          bin_dir=".artifacts/cargo-target/${rust_target}/release"
          for bin in fort fortd fort-agent; do
            [[ -x "${bin_dir}/${bin}" ]] || { echo "missing ${bin_dir}/${bin}" >&2; exit 1; }
          done
          "${bin_dir}/fort" version
          mkdir -p dist
          archive="dist/fort_${version}_${os}_${arch}.tar.gz"
          tar -czf "${archive}" -C "${bin_dir}" fort fortd fort-agent
          ls -lah dist

      - name: Upload target archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: fort-release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-assets:
    name: Verify and publish release assets
    needs: [resolve-tag, build-release-asset]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Download target archives
        uses: actions/download-artifact@v4
        with:
          pattern: fort-release-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum fort_*.tar.gz > checksums.txt)
          cat dist/checksums.txt
          ls -lah dist

      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="${tag#v}"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%%-*}"
            arch="${target##*-}"
            asset="dist/fort_${version}_${os}_${arch}.tar.gz"
            [[ -f "${asset}" ]] || { echo "missing ${asset}" >&2; exit 1; }
            contents="$(tar -tzf "${asset}")"
            for bin in fort fortd fort-agent; do
              grep -qx "${bin}" <<<"${contents}" || { echo "${asset} missing ${bin} binary" >&2; exit 1; }
            done
          done
          (cd dist && sha256sum -c checksums.txt)
          echo "release archives verified for ${tag}"

      - name: Upload combined release dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: fort-release-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        if: needs.resolve-tag.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null
          gh release upload "${tag}" dist/*.tar.gz dist/checksums.txt --repo "${{ github.repository }}" --clobber

      - name: Attest release artifacts
        if: needs.resolve-tag.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

  update-homebrew-tap:
    name: Update homebrew-fort tap formula
    needs: [resolve-tag, publish-assets]
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      token_source: ${{ steps.gate.outputs.token_source }}
    steps:
      - name: Check Homebrew tap token
        id: gate
        shell: bash
        env:
          HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
          GH_PAT_AUREUMA: ${{ secrets.GH_PAT_AUREUMA }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-tag.outputs.publish }}" != "true" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Validation-only run; skipping Homebrew tap update."
          elif [[ -n "${HOMEBREW_TAP_PUSH_TOKEN}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "token_source=HOMEBREW_TAP_PUSH_TOKEN" >> "${GITHUB_OUTPUT}"
          elif [[ -n "${GH_PAT_AUREUMA}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "token_source=GH_PAT_AUREUMA" >> "${GITHUB_OUTPUT}"
            echo "HOMEBREW_TAP_PUSH_TOKEN is not configured; falling back to GH_PAT_AUREUMA for Aureuma/homebrew-fort."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Neither HOMEBREW_TAP_PUSH_TOKEN nor GH_PAT_AUREUMA is configured; skipping tap update."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}

      - name: Setup Rust
        if: steps.gate.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Download verified release dist
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fort-release-dist
          path: dist

      - name: Render and push tap formula update
        if: steps.gate.outputs.enabled == 'true'
        env:
          HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
          GH_PAT_AUREUMA: ${{ secrets.GH_PAT_AUREUMA }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          primary_token="${HOMEBREW_TAP_PUSH_TOKEN}"
          fallback_token="${GH_PAT_AUREUMA}"
          if [[ -z "${primary_token}" && -z "${fallback_token}" ]]; then
            echo "tap push token resolved empty" >&2
            exit 1
          fi

          tap_dir="${tmp_dir}/homebrew-fort"
          clone_with_token() {
            local token="$1"
            [[ -n "${token}" ]] || return 1
            rm -rf "${tap_dir}"
            git clone "https://x-access-token:${token}@github.com/Aureuma/homebrew-fort.git" "${tap_dir}"
            git -C "${tap_dir}" remote set-url origin "https://x-access-token:${token}@github.com/Aureuma/homebrew-fort.git"
          }

          run_tap_update() {
            local token="$1"
            clone_with_token "${token}"
            git -C "${tap_dir}" config user.email "github-actions[bot]@users.noreply.github.com"
            git -C "${tap_dir}" config user.name "github-actions[bot]"
            cargo run --quiet --jobs 2 --locked --release --bin fort-release -- homebrew render-tap-formula \
              --version "${tag}" \
              --checksums dist/checksums.txt \
              --tap-dir "${tap_dir}"
            git -C "${tap_dir}" add Formula/fort.rb VERSION
            if git -C "${tap_dir}" diff --cached --quiet; then
              echo "No formula changes"
              return 0
            fi
            git -C "${tap_dir}" commit -m "chore: update fort formula to ${tag}"
            git -C "${tap_dir}" push
          }

          if [[ -n "${primary_token}" ]]; then
            if run_tap_update "${primary_token}"; then
              exit 0
            fi
            if [[ -n "${fallback_token}" && "${fallback_token}" != "${primary_token}" ]]; then
              echo "Primary Homebrew token update failed; retrying with GH_PAT_AUREUMA fallback."
              run_tap_update "${fallback_token}"
              exit 0
            fi
            echo "Primary Homebrew token update failed and no distinct fallback token is available." >&2
            exit 1
          fi

          run_tap_update "${fallback_token}"

  verify-release-distribution:
    name: Verify release assets and Homebrew tap
    needs: [resolve-tag, publish-assets, update-homebrew-tap]
    runs-on: ubuntu-latest
    steps:
      - name: Verify release distribution state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ needs.resolve-tag.outputs.publish }}" != "true" ]]; then
            echo "Validation-only run; skipping published release and Homebrew tap verification."
            exit 0
          fi

          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="${tag#v}"
          if [[ -z "${version}" || "${version}" == "${tag}" ]]; then
            echo "invalid tag: ${tag}" >&2
            exit 1
          fi

          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local i
            for ((i=1; i<=attempts; i++)); do
              if "$@"; then
                return 0
              fi
              if (( i < attempts )); then
                sleep "${delay}"
              fi
            done
            return 1
          }

          assets="$(gh release view "${tag}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          required_assets=(
            "fort_${version}_linux_amd64.tar.gz"
            "fort_${version}_linux_arm64.tar.gz"
            "fort_${version}_darwin_amd64.tar.gz"
            "fort_${version}_darwin_arm64.tar.gz"
            "checksums.txt"
          )
          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq "${asset}" <<<"${assets}"; then
              echo "missing release asset: ${asset}" >&2
              exit 1
            fi
          done
          echo "release assets verified for ${tag}"

          if [[ "${{ needs.update-homebrew-tap.outputs.enabled }}" == "true" ]]; then
            tap_url="https://raw.githubusercontent.com/Aureuma/homebrew-fort/main/Formula/fort.rb"
            if ! retry 12 10 bash -lc "curl --proto '=https' --tlsv1.2 -fsSL '${tap_url}' | grep -Eq 'version\\s+\"${version}\"'"; then
              echo "Homebrew tap formula did not update to ${version} after retries" >&2
              exit 1
            fi
            echo "homebrew tap formula verified at version ${version} (token: ${{ needs.update-homebrew-tap.outputs.token_source }})"
          else
            echo "Homebrew tap update was not enabled; skipping tap verification."
          fi

  verify-homebrew-tap-install:
    name: Verify real tap install (macOS)
    needs: [resolve-tag, update-homebrew-tap, verify-release-distribution]
    runs-on: macos-latest
    steps:
      - name: Install fort from the real tap
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-tag.outputs.publish }}" != "true" ]]; then
            echo "Validation-only run; skipping real tap install."
            exit 0
          fi
          if [[ "${{ needs.update-homebrew-tap.outputs.enabled }}" != "true" ]]; then
            echo "Homebrew tap update was not enabled; skipping real tap install."
            exit 0
          fi
          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="${tag#v}"
          brew untap aureuma/fort >/dev/null 2>&1 || true
          brew tap aureuma/fort
          if brew list fort >/dev/null 2>&1; then
            brew reinstall aureuma/fort/fort
          else
            brew install aureuma/fort/fort
          fi
          reported="$(fort version)"
          if [[ "${reported}" != "${version}" ]]; then
            echo "tapped fort reports ${reported} but expected ${version}" >&2
            exit 1
          fi
          brew test aureuma/fort/fort
          echo "real tap install ok for ${tag}"
