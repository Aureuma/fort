kind: service
meta:
  name: fort-api
  labels:
    app_code: fort
router:
  mode: traefik-file
  domain: fort.aureuma.ai
  entrypoints:
    - websecure
  tls: true
  traefik_file:
    directory: /etc/traefik/dynamic
    service_port: 8088
    router_name_prefix: fort
service:
  deploy_mode: inplace
  keep_previous: false
  build:
    context: /home/shawn/Development/fort
    dockerfile: /home/shawn/Development/fort/Dockerfile
  networks:
    - viva-shared
    - si
  volumes:
    - "/var/lib/fort:/var/lib/fort"
    - "/home/shawn/Development/safe:/safe"
  health:
    kind: none
