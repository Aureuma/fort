kind: service
meta:
  name: fort-api
  labels:
    app_code: fort
router:
  mode: none
service:
  deploy_mode: inplace
  keep_previous: false
  build:
    context: /home/shawn/Development/fort
    dockerfile: /home/shawn/Development/fort/Dockerfile
  ports:
    - host: "0.0.0.0:18089"
      container: 8088
  networks:
    - viva-shared
    - si
  volumes:
    - "/var/lib/fort:/var/lib/fort"
    - "/home/shawn/Development/safe:/safe"
  health:
    kind: none
